name: Security Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy — deps + secrets + Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Dedicated secret pass, deliberately unfiltered by severity. The combined
      # scan below drops anything under HIGH, which is right for dependency
      # findings and wrong for credentials: a leaked key is not less leaked for
      # carrying a MEDIUM rule. This mirrors the dedicated pass the pre-commit
      # hook runs, so CI is not weaker than a laptop on the one finding that
      # cannot be walked back.
      #
      # Nothing gitignored exists in a CI checkout, so unlike the local hook
      # this sees exactly the files the repository actually contains.
      - name: Run Trivy (secrets)
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e  # master 2026-07-01
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          skip-dirs: .pnpm-store,node_modules/.cache

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e  # master 2026-07-01
        with:
          scan-type: fs
          scan-ref: .
          # Named explicitly: the default scanner set for a filesystem scan is
          # vuln and secret only, so misconfig was never running despite this
          # job being named for it.
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'        # fail the job on CRITICAL or HIGH
          ignore-unfixed: true  # skip vulns with no fix yet
          skip-dirs: .pnpm-store,node_modules/.cache

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --ignore-unfixable mirrors the Trivy job's ignore-unfixed: true —
      # skip advisories with no patched version published yet rather than
      # blocking every PR on a fix that doesn't exist (e.g. GHSA-w3rx-r6r6-pgpr/
      # GHSA-5p2g-fcmc-qvqq on image-size via @mastra/memory, and
      # GHSA-866g-f22w-33x8 on @ai-sdk/provider-utils via @mastra/core, both
      # advisories with a stated patched version that isn't actually published).
      #
      # `pnpm audit` reaches out to registry.npmjs.org's advisory endpoint and
      # exits 1 on *any* failure — a real high/critical finding OR the endpoint
      # timing out. A registry outage would otherwise block every PR's Required
      # check with nothing wrong in the tree. This retries, and tolerates only
      # the network-error case (Trivy's offline scan is the real dependency
      # gate); a genuine advisory still fails the job on the first attempt.
      - name: pnpm audit
        run: |
          audit='pnpm audit --audit-level=high --ignore-unfixable'  # disclosure-ok: pnpm CLI flag, same as the step this replaces
          for attempt in 1 2 3; do
            if out=$($audit 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qiE 'advisories/bulk error|TimeoutError|operation was aborted|ECONNRESET|ENOTFOUND|EAI_AGAIN|socket hang up|network'; then
              echo "::warning::pnpm audit attempt $attempt could not reach the npm advisory registry; retrying"
              sleep 20
              continue
            fi
            echo "::error::pnpm audit exited non-zero for a reason other than an unreachable registry"
            exit 1
          done
          echo "::warning::pnpm audit could not reach the npm advisory registry after 3 attempts — relying on the Trivy dependency scan for this run"
          exit 0

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: pip install -r .github/security-tools/requirements.txt --quiet

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config=auto \
            --error \
            --no-rewrite-rule-ids \
            --skip-unknown-extensions \
            . 2>&1

  zizmor:
    name: Zizmor — GitHub Actions workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install -r .github/security-tools/requirements.txt --quiet

      - name: Audit workflows
        # Catches script-injection via untrusted ${{ github.event.* }} interpolation,
        # unpinned third-party actions (tag/branch instead of commit SHA — the exact
        # class of thing this repo's own actions are pinned against below), overly
        # broad `permissions:`, and unsafe pull_request_target usage. Regular persona
        # (not --pedantic) to match this pipeline's existing bar — blocking on real
        # findings, not code-smell-level nitpicks like missing concurrency groups.
        run: zizmor .github/workflows/

  trust-policy:
    name: Supply-chain trust audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fails if any dependency has a trust downgrade (provenance attestation removed
    # relative to an earlier version — indicator of possible package takeover).
    # Runs separately from the main install so local dev is not blocked by beta deps
    # that legitimately lack provenance (e.g. next-auth@5.0.0-beta.x).
    # Known exceptions tracked here — remove when the package ships provenance:
    #   next-auth@5.0.0-beta.31 — Auth.js v5 beta; no provenance on pre-releases.
    #                             Re-enable strict check when v5 stable ships.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Check for trust downgrades
        # Inject trustPolicy via env — overrides pnpm-workspace.yaml for this job only.
        # Expected failures listed below are reviewed on every Auth.js beta bump.
        env:
          NPM_CONFIG_TRUST_POLICY: no-downgrade
        run: |
          set +e
          OUTPUT=$(pnpm install --frozen-lockfile 2>&1)
          EXIT=$?
          echo "$OUTPUT"

          if [ $EXIT -ne 0 ]; then
            # Strip expected known exceptions before failing
            UNEXPECTED=$(echo "$OUTPUT" | grep "ERR_PNPM_TRUST_DOWNGRADE" | \
              grep -v "next-auth@5.0.0-beta")

            if [ -n "$UNEXPECTED" ]; then
              echo ""
              echo "🚨 UNEXPECTED trust downgrade(s) detected — possible supply chain attack:"
              echo "$UNEXPECTED"
              echo ""
              echo "ACTION: inspect the flagged package(s) immediately."
              echo "  - Check npmjs.com for recent publish activity"
              echo "  - Compare against the last known-good lockfile"
              echo "  - If confirmed malicious: remove from package.json, run pnpm install, open incident"
              exit 1
            else
              echo ""
              echo "⚠️  Known trust exceptions present (next-auth beta — tracked, not blocking)."
              echo "    Review if next-auth version changed since last check."
            fi
          else
            echo "✅ All dependencies pass trust policy check."
          fi
