name: Security Scan

on:
  # Push runs only on main (plus the weekly schedule below); branches with an
  # open PR are covered by pull_request, so scanning both doubled every run.
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC

# Deny by default. Every job below declares the permissions it needs.
permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy — deps + secrets + Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Dedicated secret pass, deliberately unfiltered by severity. The combined
      # scan below drops anything under HIGH, which is right for dependency
      # findings and wrong for credentials: a leaked key is not less leaked for
      # carrying a MEDIUM rule. This mirrors the dedicated pass the pre-commit
      # hook runs, so CI is not weaker than a laptop on the one finding that
      # cannot be walked back.
      #
      # Nothing gitignored exists in a CI checkout, so unlike the local hook
      # this sees exactly the files the repository actually contains.
      - name: Run Trivy (secrets)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec  # master 2026-07-01
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          skip-dirs: .pnpm-store,node_modules/.cache

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec  # master 2026-07-01
        with:
          scan-type: fs
          scan-ref: .
          # Named explicitly: the default scanner set for a filesystem scan is
          # vuln and secret only, so misconfig was never running despite this
          # job being named for it.
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'        # fail the job on CRITICAL or HIGH
          ignore-unfixed: true  # skip vulns with no fix yet
          skip-dirs: .pnpm-store,node_modules/.cache

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --ignore-unfixable mirrors the Trivy job's ignore-unfixed: true —
      # skip advisories with no patched version published yet rather than
      # blocking every PR on a fix that doesn't exist (e.g. GHSA-w3rx-r6r6-pgpr/
      # GHSA-5p2g-fcmc-qvqq on image-size via @mastra/memory, and
      # GHSA-866g-f22w-33x8 on @ai-sdk/provider-utils via @mastra/core, both
      # advisories with a stated patched version that isn't actually published).
      #
      # `pnpm audit` reaches out to registry.npmjs.org's advisory endpoint and
      # exits 1 on *any* failure — a real high/critical finding OR the endpoint
      # timing out. A registry outage would otherwise block every PR's Required
      # check with nothing wrong in the tree. This retries, and tolerates only
      # the network-error case (Trivy's offline scan is the real dependency
      # gate); a genuine advisory still fails the job on the first attempt.
      - name: pnpm audit
        run: |
          audit='pnpm audit --audit-level=high --ignore-unfixable'  # disclosure-ok: pnpm CLI flag, same as the step this replaces
          for attempt in 1 2 3; do
            if out=$($audit 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qiE 'advisories/bulk error|TimeoutError|operation was aborted|ECONNRESET|ENOTFOUND|EAI_AGAIN|socket hang up|network'; then
              echo "::warning::pnpm audit attempt $attempt could not reach the npm advisory registry; retrying"
              sleep 20
              continue
            fi
            echo "::error::pnpm audit exited non-zero for a reason other than an unreachable registry"
            exit 1
          done
          echo "::warning::pnpm audit could not reach the npm advisory registry after 3 attempts — relying on the Trivy dependency scan for this run"
          exit 0

  snyk:
    name: Snyk — open source dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pull requests from forks do not receive repository secrets, so there is
      # no token to authenticate with. Skip with a notice instead of failing:
      # Trivy and pnpm audit above still gate those PRs.
      - name: Check for Snyk token
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  # zizmor: ignore[secrets-outside-env] repo-level secret, read-only scan, no deploy environment exists
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::notice::SNYK_TOKEN is not available for this run (fork PR or secret not set); skipping Snyk."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Snyk CLI
        if: steps.token.outputs.present == 'true'
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04  # v1.0.0

      # --exclude=security-tools skips .github/security-tools/requirements.txt: Snyk
      # resolves Python projects by reading installed packages, this job does not
      # install them, and Trivy and Dependabot already cover that file.
      #
      # Snapshot to the private Snyk dashboard first, so the findings are there
      # even when the gate below fails. Only pushes to the default branch upload:
      # a pull request snapshot would replace the baseline with unmerged code.
      - name: Snyk monitor (private dashboard)
        if: steps.token.outputs.present == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  # zizmor: ignore[secrets-outside-env] repo-level secret, read-only scan, no deploy environment exists
        run: snyk monitor --all-projects --exclude=security-tools

      # The gate keeps working but its findings are not printed: this is a
      # public repository and the job log is public, so stdout (where `snyk
      # test` writes every finding) is discarded and the details are read in
      # the Snyk dashboard. stderr stays visible, so a CLI or auth failure still
      # explains itself. --fail-on=upgradable mirrors Trivy's ignore-unfixed:
      # only fail when a fix exists, so an advisory with no patched release does
      # not block every PR.
      - name: Snyk test (open source dependencies, output withheld)
        if: steps.token.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  # zizmor: ignore[secrets-outside-env] repo-level secret, read-only scan, no deploy environment exists
        run: |
          set +e
          snyk test --all-projects --exclude=security-tools --severity-threshold=high --fail-on=upgradable > /dev/null
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "Snyk found no high severity dependency issues with an available fix."
          elif [ "$code" -eq 1 ]; then
            echo "::error::Snyk found high severity dependency issues with an available fix. Details are in the Snyk dashboard, not in this log."
          else
            echo "::error::Snyk could not complete (exit code $code)."
          fi
          exit "$code"

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: pip install -r .github/security-tools/requirements.txt --quiet

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config=auto \
            --error \
            --no-rewrite-rule-ids \
            --skip-unknown-extensions \
            . 2>&1

  zizmor:
    name: Zizmor — GitHub Actions workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install -r .github/security-tools/requirements.txt --quiet

      - name: Audit workflows
        # Catches script-injection via untrusted ${{ github.event.* }} interpolation,
        # unpinned third-party actions (tag/branch instead of commit SHA — the exact
        # class of thing this repo's own actions are pinned against below), overly
        # broad `permissions:`, and unsafe pull_request_target usage.
        #
        # The token is read-only (this job has `contents: read`) and is what turns
        # on zizmor's online audits: a pinned SHA that only exists in a fork
        # (impostor commits), actions with known vulnerabilities, and tag/branch
        # confusion. Without it those audits are silently skipped.
        #
        # Auditor persona with a medium severity floor: it sees everything the
        # regular persona hides, but low-severity style findings (missing
        # concurrency groups, stale-looking refs) do not block a merge.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona auditor --min-severity medium .github/workflows/

  trust-policy:
    name: Supply-chain trust audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fails if any dependency has a trust downgrade (provenance attestation removed
    # relative to an earlier version — indicator of possible package takeover).
    # Runs separately from the main install so local dev is not blocked by beta deps
    # that legitimately lack provenance (e.g. next-auth@5.0.0-beta.x).
    # Known exceptions tracked here — remove when the package ships provenance:
    #   next-auth@5.0.0-beta.31 — Auth.js v5 beta; no provenance on pre-releases.
    #                             Re-enable strict check when v5 stable ships.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Check for trust downgrades
        # Inject trustPolicy via env — overrides pnpm-workspace.yaml for this job only.
        # Expected failures listed below are reviewed on every Auth.js beta bump.
        env:
          NPM_CONFIG_TRUST_POLICY: no-downgrade
        run: |
          set +e
          OUTPUT=$(pnpm install --frozen-lockfile 2>&1)
          EXIT=$?
          echo "$OUTPUT"

          if [ $EXIT -ne 0 ]; then
            # Strip expected known exceptions before failing
            UNEXPECTED=$(echo "$OUTPUT" | grep "ERR_PNPM_TRUST_DOWNGRADE" | \
              grep -v "next-auth@5.0.0-beta")

            if [ -n "$UNEXPECTED" ]; then
              echo ""
              echo "🚨 UNEXPECTED trust downgrade(s) detected — possible supply chain attack:"
              echo "$UNEXPECTED"
              echo ""
              echo "ACTION: inspect the flagged package(s) immediately."
              echo "  - Check npmjs.com for recent publish activity"
              echo "  - Compare against the last known-good lockfile"
              echo "  - If confirmed malicious: remove from package.json, run pnpm install, open incident"
              exit 1
            else
              echo ""
              echo "⚠️  Known trust exceptions present (next-auth beta — tracked, not blocking)."
              echo "    Review if next-auth version changed since last check."
            fi
          else
            echo "✅ All dependencies pass trust policy check."
          fi
