name: CI

# The one thing every other check in this repo assumes already happened:
# `pnpm test` and `pnpm build` pass. AGENTS.md makes that a hard gate for any
# PR opened through Claude, but nothing enforced it for a PR opened any other
# way — a contributor pushing directly, or editing through the GitHub web UI,
# had no check catching a broken build or a failing test before merge. Now
# that the repo is public, that gap is a real path for the default branch to
# go red on someone else's PR.
#
# Neither script needs a database or any secret — both were verified to pass
# with an empty environment, since the schema-level DATABASE_URL/ENCRYPTION_KEY
# checks in lib/db/drizzle.ts and lib/crypto/tokens.ts are lazy (evaluated on
# first call, not at import), and every route Next.js touches during `next
# build` is server-rendered on demand rather than statically generated.

# Push runs only on main. A branch with an open PR is already covered by the
# pull_request event, and running both made every commit execute the whole
# suite twice (their concurrency groups differ, so neither cancelled the
# other). Required status checks match on job name, not on event, so the
# pull_request run still satisfies them.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

# Deny by default. Every job below declares the permissions it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llms-txt:
    name: Check llms.txt freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - run: node scripts/sync-llms-txt.mjs --check

  # Unit tests and the production build used to run back to back in one job
  # (about 2.5 minutes each). They are independent, so they now run in
  # parallel, and the unit tests are sharded across runners. The `test-and-build`
  # job below keeps the old "Test + build" name as the single required check,
  # so branch protection does not need to know how the work is divided.
  unit-tests:
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test --shard=${{ matrix.shard }}/3

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Persist `.next/cache` so an unchanged dependency set rebuilds
      # incrementally instead of from cold. The fallback key restores the
      # closest cache when only the source hash changed.
      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .next/cache
          key: nextjs-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'content/**', 'drizzle/**', 'public/**', 'next.config.*', 'package.json') }}
          restore-keys: |
            nextjs-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

  test-and-build:
    name: Test + build
    # `always()` so this job reports a result even when an upstream job
    # failed or was cancelled. Without it a failure would leave this required
    # check "skipped", which branch protection can treat as passing.
    if: ${{ always() }}
    needs: [unit-tests, build]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Require unit tests and build to pass
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "unit-tests: $UNIT_TESTS_RESULT"
          echo "build: $BUILD_RESULT"
          if [ "$UNIT_TESTS_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ]; then
            exit 1
          fi

  lint-and-types:
    name: Lint + types
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `.source` is generated and gitignored, so it does not exist on a fresh
      # checkout — without this, typecheck fails on lib/docs/source.ts alone
      # ("Cannot find module '@/.source/server'"). Same ordering `prebuild` uses.
      - run: pnpm exec fumadocs-mdx

      - run: pnpm lint

      # tsconfig.json sets `incremental`, so tsc writes tsconfig.tsbuildinfo
      # (gitignored). Restoring the previous run's file lets tsc re-check only
      # what changed; tsc validates it against file contents, so a stale cache
      # costs time, never correctness.
      - name: Cache the TypeScript incremental build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm typecheck

      - run: pnpm test:e2e:typecheck

  test-e2e:
    name: Test e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Matches docker-compose.yml's postgres service (same image, user, password,
    # admin db name) so playwright.config.ts's default TEST_DATABASE_URL resolves
    # here unchanged. Note ensureTestDatabaseExists() in e2e/global-setup.ts
    # does NOT cover CI: Playwright starts webServer (next start, which runs
    # migrations from instrumentation.ts the moment it boots) before running
    # globalSetup — see createGlobalSetupTasks in playwright's own runner,
    # plugin setup (webServer) always precedes the user's globalSetup file.
    # On a developer machine community_test already exists from a prior run,
    # so this never surfaced there; on a fresh CI run it doesn't exist yet and
    # the server crash-loops on "database community_test does not exist"
    # until the webServer launch times out. The step below creates it before
    # `pnpm test:e2e` starts the server, closing that gap.
    services:
      postgres:
        # Matches docker-compose.yml's postgres image — pgvector required by
        # kb_articles.embedding_vec (drizzle/0043_kb_vector_index.sql).
        # Pinned by digest (multi-arch index for pg16) so a retagged or replaced
        # upstream image cannot change what the e2e job runs against. To bump,
        # resolve the current pg16 digest and replace it here. The compose files
        # still use the plain pg16 tag.
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
          POSTGRES_DB: community
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U community"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `.source` is generated and gitignored — playwright.config.ts's webServer
      # runs a real `next build`, which needs it, same as lint-and-types above.
      - run: pnpm exec fumadocs-mdx

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Runner-side apt traffic occasionally fails DNS for minutes at a time.
      # Without limits each failed attempt spends ~11 minutes inside apt's own
      # retries before the job dies, and the only recovery is a manual rerun.
      # Make apt give up on a stalled fetch quickly and retry the whole install
      # a few times, so a transient network blip no longer fails the e2e job.
      - name: Configure apt for flaky networks
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network-resilience >/dev/null

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "Attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      # Chromium is cached, but its OS-level shared library deps (from --with-deps)
      # are not — reinstall those on a cache hit without re-downloading the browser.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install-deps chromium && exit 0
            echo "Attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      # Must exist before playwright.config.ts's webServer runs `next start` —
      # instrumentation.ts migrates the moment the server boots, and that
      # happens before e2e/global-setup.ts gets a chance to create this
      # database (see the comment on the postgres service above).
      - name: Create test database
        env:
          PGPASSWORD: community
        run: psql -h localhost -U community -d community -c "CREATE DATABASE community_test"

      # playwright.config.ts's webServer runs a real `next build` before the
      # server can answer, and the whole of that has to finish inside the
      # webServer timeout. Persisting `.next/cache` (the Next.js guide for CI
      # build caching) turns the common case, where dependencies are the same
      # and only some source changed, from a cold build into an incremental
      # one. The fallback key restores the closest cache when the source hash
      # changed but the lockfile did not.
      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'content/**', 'drizzle/**', 'public/**', 'next.config.*', 'package.json') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm test:e2e
