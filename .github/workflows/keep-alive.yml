name: Keep-alive ping

# Prod runs on the database and it should have a weekly health check
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping production health endpoint
    runs-on: ubuntu-latest
    # No checkout, no GITHUB_TOKEN use — just an outbound curl.
    permissions: {}

    steps:
      - name: Curl /api/health
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://app.answerloops.com/api/health)
          echo "Health endpoint responded with status $status"
          if [ "$status" -ne 200 ]; then
            exit 1
          fi
