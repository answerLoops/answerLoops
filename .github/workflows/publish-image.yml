name: Publish Image

# Publishes the container image to GHCR so self-hosting does not require a local
# build. One image serves both services: app and bot run the same `runner` stage
# and differ only in their command, which is why nothing here builds twice.
#
# Built natively on both architectures rather than emulated. A Next.js build
# under QEMU takes tens of minutes and regularly outlasts anyone's patience;
# GitHub's arm64 runners are free for public repositories, so each architecture
# builds on its own hardware and a final job stitches them into one manifest.
#
# Runs on a published release (and on demand), not on every push to main. The
# `latest` tag only moves on a release anyway — see the metadata step in the
# merge job — so a per-push run only ever produced a `main`/sha tag that no
# deployment consumes. It also coupled the production deploy to this workflow:
# the platform host waits on the whole check suite for a commit, so any red run
# here held every deploy from main. Cutting the push trigger removes that
# coupling; cut a release, or dispatch manually, to publish a fresh image.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercased, not ${{ github.repository }} directly. This repository's name is
  # mixed case (AnswerLoops/answerLoops) and container registries only accept
  # lowercase references, so the raw value is rejected by buildx before it even
  # reaches the registry. Hardcoded rather than lowercased at runtime so the
  # value is visible here and identical in every job that builds a tag from it.
  IMAGE_NAME: answerloops/answerloops

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded locally first so it can be scanned before anything
      # reaches the registry. A published layer cannot be unpublished: deleting
      # a tag leaves the digest pullable, and a credential in a layer survives
      # being deleted in a later one. The push below is a cache hit, so this
      # costs a scan rather than a second build.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          load: true
          tags: scan-candidate:${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      # Unfiltered by severity, unlike the dependency scan: a credential in an
      # image is not less serious for carrying a lower rule severity, and this
      # is the last point at which it can still be caught.
      - name: Refuse to publish an image containing secrets
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-07-01
        with:
          scan-type: image
          image-ref: scan-candidate:${{ matrix.suffix }}
          scanners: secret
          format: table
          exit-code: '1'

      # Scoped to /app — the application and its dependencies, which are what
      # this repository chooses and can act on. The Node base image also ships
      # npm and pnpm under /usr/local/lib/node_modules; those are upstream's to
      # version, this repository cannot patch them from a lockfile, and a gate
      # that blocks every deploy on something the deploy cannot fix stops being
      # a gate and starts being an outage. They are tracked separately and
      # addressed by removing that tooling from the runtime stage, which is the
      # actual fix rather than a suppression.
      #
      # The secret scan above is deliberately NOT scoped: it stays whole-image.
      - name: Refuse to publish known-vulnerable dependencies
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-07-01
        with:
          scan-type: image
          image-ref: scan-candidate:${{ matrix.suffix }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: /usr/local/lib/node_modules
          format: table
          exit-code: '1'

      # Pushed by digest rather than tag: the tags belong on the manifest that
      # merges both architectures, not on either half of it.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Passed through env rather than interpolated into the script: the shell
      # does the prefix strip, and workflow expressions never reach the command.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves only on a published release. A push to main publishes
      # `main` and a sha tag instead, so someone running `latest` gets whatever
      # was last released rather than whatever merged an hour ago.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=sha,format=long

      - name: Create and push the manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Show what was published
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
