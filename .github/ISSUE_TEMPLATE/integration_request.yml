name: New channel or integration
description: Ask for answerLoops to work with another chat platform, community tool, knowledge source, or AI provider.
labels: ["enhancement"]
body:
  - type: input
    id: name
    attributes:
      label: Which platform or tool?
      placeholder: Microsoft Teams, Zendesk, Confluence, ...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of integration is it?
      options:
        - A channel where questions come in
        - A knowledge source to learn from
        - An AI or embeddings provider
        - Something else
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: How would you use it?
      description: Describe your community or support setup and what you'd want answerLoops to do there.
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to the platform's developer docs
      description: A link to its API or bot documentation helps a lot, if you have one.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to help build it?
      options:
        - Yes, I'd like to build it
        - Yes, with some guidance
        - No, I'm just requesting it
    validations:
      required: true
