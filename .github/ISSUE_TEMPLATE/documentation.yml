name: 📚 Documentation issue
description: Something in the docs is missing, unclear, or wrong.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        > **Start here:** new to the project? Read [CONTRIBUTING.md](https://github.com/answerLoops/answerLoops/blob/main/CONTRIBUTING.md) first. It covers the ground rules, running answerLoops locally, and how to open a pull request.
  - type: input
    id: page
    attributes:
      label: Which page?
      description: A link to the docs page, README section, or file.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
      description: Tell us what confused you, what's out of date, or what you expected to find.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional. If you know what it should say, write it here. A docs pull request is even better.
