<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Every Interaction Makes Your Community Stronger</title>
  <desc id="desc">A member asks in community chat or a forum. AnswerLoops finds relevant guides, drafts an answer, and checks it against the sources. With auto-reply enabled, a qualifying answer can post in the channel. Teams can save useful resolutions as knowledge for future questions. Supported channels include Discord, Slack, Discourse, Circle, GitHub, Telegram, email, Google Chat, and website chat.</desc>
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#f7f0e4"/>
      <stop offset=".49" stop-color="#e5f3f2"/>
      <stop offset="1" stop-color="#eee8f8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0l7 3.5L0 7z" fill="#168fa3"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#082e50" flood-opacity=".09"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
    .heading{fill:#082e50;font-size:29px;font-weight:750;letter-spacing:-.6px}
    .card-title{fill:#082e50;font-size:19px;font-weight:750;letter-spacing:-.3px}
    .body{fill:#36576c;font-size:15px;font-weight:500}
    .sample{fill:#082e50;font-size:15px;font-weight:650}
    .label{fill:#315e81;font-size:12px;font-weight:750;letter-spacing:.75px}
    .final .card-title,.final .sample{fill:#fff}
    .final .body{fill:#d6e7ee}
    .final .label{fill:#b3dce3}
    .channel{fill:#164365;font-size:14px;font-weight:650;text-anchor:middle}
  </style>
  <rect x="1" y="1" width="1198" height="568" rx="27" fill="url(#surface)" stroke="#cbdade"/>
  <text x="42" y="62" class="heading">Every Interaction Makes Your Community Stronger</text>
  <g>
    <rect x="902" y="32" width="256" height="40" rx="20" fill="#fff" fill-opacity=".9"/>
    <circle cx="927" cy="52" r="4" fill="#168fa3"/>
    <text x="941" y="57" class="label">ANSWERED FROM YOUR DOCS</text>
  </g>
  <g fill="none" stroke="#168fa3" stroke-width="2" marker-end="url(#arrow)">
    <path d="M307 214h15"/><path d="M591 214h15"/><path d="M875 214h15"/>
    <path d="M1027 340v25q0 14-14 14H473q-14 0-14-14v-24"/>
  </g>
  <g class="step-1" transform="translate(42 96)">
    <rect width="264" height="244" rx="18" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(20 17)" fill="none" stroke="#168fa3" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h22v15H11l-7 6v-6H4z"/></g>
    <text x="20" y="70" class="card-title"><tspan x="20" dy="0">Ask in the community</tspan></text>
    <text x="20" y="117" class="body"><tspan x="20" dy="0">Members ask in the channels</tspan><tspan x="20" dy="22">they already use.</tspan></text>
    <rect x="18" y="151" width="228" height="74" rx="11" fill="#edf5f6"/>
    <g><text x="31" y="179" class="sample"><tspan x="31" dy="0">Where can I watch the</tspan><tspan x="31" dy="22">workshop replay?</tspan></text></g>
  </g>
  <g class="step-2" transform="translate(326 96)">
    <rect width="264" height="244" rx="18" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(20 17)" fill="none" stroke="#168fa3" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h12l7 7v17H7z M19 3v7h7 M12 15h9 M12 20h9"/></g>
    <text x="20" y="70" class="card-title"><tspan x="20" dy="0">Get an answer</tspan><tspan x="20" dy="23">from your guides</tspan></text>
    <text x="20" y="117" class="body"><tspan x="20" dy="0">AnswerLoops finds relevant</tspan><tspan x="20" dy="22">articles and drafts a reply.</tspan></text>
    <rect x="18" y="151" width="228" height="74" rx="11" fill="#edf5f6"/>
    <g><text x="31" y="179" class="sample"><tspan x="31" dy="0">Workshop replay guide</tspan><tspan x="31" dy="22">Member resource library</tspan></text></g>
  </g>
  <g class="step-3" transform="translate(610 96)">
    <rect width="264" height="244" rx="18" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(20 17)" fill="none" stroke="#168fa3" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3c4 3 8 4 11 5v7c0 6-5 10-11 13C9 25 4 21 4 15V8c3-1 7-2 11-5z M10 15l4 4 7-8"/></g>
    <text x="20" y="70" class="card-title"><tspan x="20" dy="0">See the sources</tspan></text>
    <text x="20" y="117" class="body"><tspan x="20" dy="0">A second AI checks the draft</tspan><tspan x="20" dy="22">against the sources.</tspan></text>
    <rect x="18" y="151" width="228" height="74" rx="11" fill="#edf5f6"/>
    <g><text x="31" y="179" class="sample"><tspan x="31" dy="0">Reply matches</tspan><tspan x="31" dy="22">the cited guides</tspan></text></g>
  </g>
  <g class="step-4 final" transform="translate(894 96)">
    <rect width="264" height="244" rx="18" fill="#082e50" filter="url(#shadow)"/>
    <g transform="translate(20 17)" fill="none" stroke="#a4dbe1" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13 27 3 17 27l-4-10z M13 17 27 3"/></g>
    <text x="20" y="70" class="card-title"><tspan x="20" dy="0">Get help and move forward</tspan></text>
    <text x="20" y="117" class="body"><tspan x="20" dy="0">Members get a reply, or your</tspan><tspan x="20" dy="22">team takes over.</tspan></text>
    <rect x="18" y="151" width="228" height="74" rx="11" fill="#234762"/>
    <g><text x="31" y="179" class="sample"><tspan x="31" dy="0">Member gets a link</tspan><tspan x="31" dy="22">to the replay</tspan></text></g>
  </g>
  <rect x="557" y="361" width="396" height="36" rx="18" fill="#e6f3f2" stroke="#c5e3e3"/>
  <text x="755" y="384" text-anchor="middle" class="body">Turn useful answers into guides for future questions</text>
  <text x="600" y="442" text-anchor="middle" class="card-title">Works wherever your community asks</text>
