<svg xmlns="http://www.w3.org/2000/svg" width="880" height="395" viewBox="0 0 880 395" role="img" aria-labelledby="title desc">
  <title id="title">Website chat on a course help center</title>
  <desc id="desc">A visitor opens the website chat and asks how to download a course certificate. The widget gives a short answer and points to the published certificates guide.</desc>
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#f7f0e4"/><stop offset=".53" stop-color="#e5f3f2"/><stop offset="1" stop-color="#eee8f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#082e50" flood-opacity=".14"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,sans-serif}
    .label{font-size:14px;font-weight:700;fill:#315e81}
    .title{font-size:25px;font-weight:750;fill:#082e50}
    .copy{font-size:17px;font-weight:500;fill:#082e50}
    .white{fill:#fff}
  </style>

  <rect x="1" y="1" width="878" height="393" rx="22" fill="url(#surface)" stroke="#cbdade"/>
  <rect x="40" y="66" width="710" height="279" rx="15" fill="#fff" stroke="#cbdade"/>
  <path d="M41 109h708" stroke="#dce7ed"/>
  <circle cx="58" cy="88" r="3" fill="#9bb7c7"/><circle cx="70" cy="88" r="3" fill="#9bb7c7"/><circle cx="82" cy="88" r="3" fill="#9bb7c7"/>
  <rect x="100" y="76" width="234" height="24" rx="6" fill="#edf5f6"/>
  <text x="113" y="93" class="label">Course help center</text>
  <text x="66" y="155" class="label">LEARNER RESOURCES</text>
  <text x="66" y="193" class="title">Course certificates</text>
  <text x="66" y="226" class="copy">Find and download your certificate</text>
  <text x="66" y="251" class="copy">after completing a course.</text>

  <rect x="401" y="30" width="437" height="318" rx="18" fill="#fff" stroke="#cbdade" filter="url(#shadow)"/>
  <path d="M402 86h435" stroke="#dce7ed"/>
  <circle cx="428" cy="58" r="14" fill="#117b8d"/>
  <path d="M423 53h10v8h-6l-4 3z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="452" y="65" class="copy" style="font-weight:750">Course support</text>
  <rect x="487" y="103" width="332" height="47" rx="11" fill="#117b8d"/>
  <text x="504" y="132" class="copy white">How do I download my certificate?</text>

  <rect x="420" y="164" width="385" height="70" rx="11" fill="#edf5f6"/>
  <text x="435" y="192" class="copy">Open your completed course and select</text>
  <text x="435" y="216" class="copy">Download certificate.</text>
  <rect x="420" y="247" width="385" height="45" rx="9" fill="#fff" stroke="#cbdade"/>
  <text x="435" y="275" class="label">Course certificates guide →</text>
  <rect x="420" y="305" width="385" height="28" rx="14" fill="#edf5f6"/>
  <text x="435" y="324" class="label">Ask another question…</text>
</svg>
