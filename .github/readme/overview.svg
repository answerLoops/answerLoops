<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="478" viewBox="0 0 1200 478" role="img" aria-labelledby="title desc">
<title id="title">How answerLoops works, and the channels it works with</title>
<desc id="desc">A community question becomes an answer drafted from your documentation. A second AI Agent checks the draft against its sources. Your team approves replies, or enables automatic replies for qualifying questions. Useful resolutions can be saved as knowledge for future answers. Works with Discord, Slack, Discourse, Circle, GitHub, Telegram, email, Google Chat, and website chat.</desc>
