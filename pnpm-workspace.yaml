packages:
  - packages/*

# Supply-chain hardening
blockExoticSubdeps: true       # block deps installed from non-registry sources (git, file, http)
minimumReleaseAge: 10080       # require packages to be 7 days old before installing (minutes)
# trustPolicy: no-downgrade — disabled: next-auth@5.0.0-beta.31 lacks provenance attestation
# Re-enable when Auth.js v5 stable ships with provenance

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  '@scarf/scarf': false # telemetry-only postinstall script, no functional need
  '@sentry/cli': true # downloads the prebuilt sentry-cli binary for source-map upload at build time
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@mendable/firecrawl-js@4.28.1'
  # Two critical-severity Next.js advisories (GHSA-2xp9-vwfh-vxw4 image  disclosure-ok
  # optimization; the Windows-host one) fixed in 16.3.3 — first-party Vercel
  # release. Kept as an explicit exclude for consistency with the entries
  # below; 16.3.3 is in fact already past the 7-day aging window. @next/* are
  # next's own per-platform binary/env subpackages, published in lockstep.
  - 'next@16.3.3'
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  # 1 critical (email-normalizer homoglyph bypass) + 2 high Auth.js advisories
  # fixed only in next-auth 5.0.0-beta.32 / @auth/core 0.41.3 — first-party
  # Auth.js release, can't wait out the normal 7-day aging window.
  - 'next-auth@5.0.0-beta.32'
  - '@auth/core@0.41.3'
  # disclosure-ok  High-severity event-loop DoS (CVE-2026-93749), fixed only
  # in 1.2.2 — released 2026-09-30, inside the 7-day aging window as of this
  # fix. Trivy gates CI on it now, so excluded rather than waiting the window out.
  - 'source-map-js@1.2.2'
overrides:
  ws: '>=8.21.0'
  shell-quote: '>=1.8.5'   # GHSA-395f-4hp3-45gv — >=1.8.4 wasn't actually patched, 1.8.4 itself is vulnerable
  undici: '>=6.28.0 <7.0.0'   # GHSA-8xcm-r25x-g524 (response desync via retry interceptor) — raised from ^6.27.0, reached via discord.js. Capped below 7.x after an open range let a newer transitive demand (added by @mastra/pg/@mastra/memory) drag discord.js's pinned undici@6.24.1 up to 8.9.0 — 3 majors past what discord.js@14.26.4/@discordjs/rest@2.6.1 actually declare and are built against, breaking their Headers construction at runtime (bot crash-looped on every Discord REST call). Same failure mode already caught once below for js-yaml's <4.0.0 cap — apply the same defensive bound to every open-ended override, not just the one that already broke.
  postcss: '>=8.5.23'   # GHSA-fxqj-rqcc-2cmp (incomplete fix of GHSA-6g55-p6wh-862q, arbitrary .map disclosure) — raised from >=8.5.18, which the newer advisory outgrew
  sharp: '>=0.35.4 <0.36.0'   # disclosure-ok  GHSA-f88m-g3jw-g9cj (inherited libvips CVEs 2026-33327/33328/35590/35591) + GHSA-rgj7-g3m4-5g8c (inherited libheif GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545), both fixed in 0.35.4; pulled in by next and next-auth>next. Capped below 0.36 (a major) per the open-range lesson below
  js-yaml: '>=3.15.2 <4.0.0'   # disclosure-ok  GHSA-5p4m-2wfm-xmqj (quadratic CPU consumption in !!omap resolution) + CVE-2026-84375, both fixed in 3.15.2 — reached via @mastra/core>gray-matter, which requires the legacy 3.x safeLoad/safeDump API removed in 4.x; an open range resolved to 5.x and broke gray-matter entirely
  '@xmldom/xmldom': '>=0.8.15 <0.9.0'   # disclosure-ok  CVE-2026-83605 / -83607 / -83608 / -83613 / -83614 / -83615 / -83616 / -83619, all fixed in 0.8.15 — reached via mammoth (.docx KB import). Capped below 0.9 (a major with API changes mammoth doesn't declare support for) per the open-range lesson below
  nanoid: '>=3.3.17'   # GHSA-2v37-7h3g-55p8 (custom generators loop indefinitely on size 0) — reached via fumadocs-core/fumadocs-mdx>next>postcss
  esbuild: '>=0.24.3'   # GHSA-67mh-4wv8-2f99 (dev server accepts requests from any origin) — reached via drizzle-kit>@esbuild-kit
  hono: '>=4.13.5'   # disclosure-ok  GHSA-gqvv-2mrq-wpjv, GHSA-g6gw-c38x-mqfc, GHSA-crvj-82cr-hjcx — reached via @mastra/core>@modelcontextprotocol/sdk. Raised from >=4.12.34, which cleared the prior round of Hono advisories but not this one
  '@ai-sdk/provider-utils@>=3.0.0 <3.0.28': '3.0.31'   # disclosure-ok  GHSA-866g-f22w-33x8, 3.x range — @copilotkit/runtime requires ^3.x directly; scoped to that range so it never gets force-bumped to a major it doesn't declare support for (that unscoped bump is what broke the widget chat route below)
  '@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33': '4.0.40'   # disclosure-ok  GHSA-866g-f22w-33x8, 4.x range — separately reached via a plain ^4.x consumer resolving to 4.0.30; scoped the same way as the 3.x entry above so it doesn't touch the 3.x or 5.x resolutions
  fast-uri: '>=3.1.7 <4.0.0'   # disclosure-ok  CVE-2026-84292, CVE-2026-84394, both fixed in 3.1.7 — transitive via @mastra/core / @modelcontextprotocol/sdk > ajv@8.20.0, which declares fast-uri@^3.0.6; raised from >=3.1.6, which cleared the prior round of advisories but not this one. Capped below 4.x (a major) per the open-range lesson above
  image-size: '>=2.0.3 <3.0.0'   # disclosure-ok  GHSA-w3rx-r6r6-pgpr (ICNS parser infinite loop DoS) + GHSA-5p2g-fcmc-qvqq — reached via @mastra/memory>probe-image-size. Capped below 3.x per the open-range lesson above
  qs: '>=6.16.0 <7.0.0'   # disclosure-ok  GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g — transitive, multiple paths. Capped below 7.x per the open-range lesson above
  baseline-browser-mapping: '>=2.11.0 <3.0.0'   # disclosure-ok  GHSA-w5vr-8v7q-w6rv — transitive via tailwindcss/browserslist tooling. Capped below 3.x per the open-range lesson above
  axios: '>=1.20.0 <2.0.0'   # disclosure-ok  CVE-2026-101898/101901/101903/101905/101906/101907/101909, all fixed in 1.20.0 — reached via @mendable/firecrawl-js and @slack/bolt's web-api client, both pinned below the range a plain caret bump could reach. Capped below 2.x per the open-range lesson above
  probe-image-size: '>=7.4.0 <8.0.0'   # disclosure-ok  CVE-2026-104861 (crafted-SVG denial of service), fixed in 7.4.0 — reached via @mastra/memory. Capped below 8.x per the open-range lesson above
  proxy-addr: '>=2.0.8 <3.0.0'   # disclosure-ok  CVE-2026-90711 (IP-spoofing via IPv4-mapped IPv6 trust-subnet bypass), fixed in 2.0.8 — reached via express (both the 4.x and 5.x lines in the tree pull it directly). Capped below 3.x per the open-range lesson above
  source-map-js: '>=1.2.2 <2.0.0'   # disclosure-ok  CVE-2026-93749 (event-loop denial of service via malformed indexed source-map sections), fixed in 1.2.2 — transitive via @tailwindcss/node and the jsdom>vitest toolchain. Capped below 2.x per the open-range lesson above
  '@graphql-tools/utils': '>=12.0.1 <13.0.0'   # disclosure-ok  prototype pollution in mergeDeep, fixed in 12.0.1 — reached via graphql-yoga (CopilotKit's GraphQL runtime). No patched 11.x release exists (11.2.2 is the last one published), and graphql-yoga still declares ^11.2.0 as of its latest stable (5.24.2) — this override forces it a major past what it declares support for, same open-range risk flagged above, but there is no in-range fix available. Verified against e2e/widget.spec.ts (CopilotKit's full chat path) before merging; re-check that suite if this ever needs bumping further.
  dompurify: '>=3.4.16 <4.0.0'   # disclosure-ok  two DOMPurify advisories (detached-subtree XSS via IN_PLACE's afterSanitize hook; forced HTML reparse via a force-removed rawtext root), both fixed in 3.4.16 — reached via mermaid, which declares ^3.3.3 (satisfied). Capped below 4.x per the open-range lesson above
  katex: '>=0.18.2 <0.19.0'   # disclosure-ok  prototype pollution bypassing trust restrictions, fixed in 0.18.2 — reached via CopilotKit/streamdown/remark-math/rehype-katex, all of which declare ^0.16.x. No patched 0.16.x release exists, so this forces every consumer past its declared range (0.x treats the middle number as breaking) — same risk as the graphql-tools entry above, no in-range fix available
  ip-address: '>=10.7.1 <11.0.0'   # disclosure-ok  four advisories (two SSRF/trust-boundary bypasses via incomplete link-local/NAT64 range classification, a cross-family address-comparison bypass, and an unbounded parse-diagnostic DoS), fixed across 10.5.1/10.7.1 — reached via express-rate-limit, which declares ^10.2.0 (satisfied). Capped below 11.x per the open-range lesson above
